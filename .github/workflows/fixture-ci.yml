name: Generate and verify fixtures

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixture-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install CAD and test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Engineering and real CAD regression tests
        run: python -m pytest --junitxml=artifacts/unit-tests.xml
      - name: Generate all engineering scenarios and reports
        run: python -m fixturelab suite --output artifacts/suite
      - name: Exercise application in Chromium
        run: python scripts/browser_smoke.py
      - name: Record resolved environment
        if: always()
        run: |
          mkdir -p artifacts
          python -m pip freeze > artifacts/resolved-environment.txt
      - name: Add report to Actions summary
        if: always()
        run: |
          if [ -f artifacts/suite/SUMMARY.md ]; then
            cat artifacts/suite/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload CAD, reports and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fixture-results-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
