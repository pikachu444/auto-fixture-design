<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parametric fixture — actual CAD mesh</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf2f6;color:#1e3144;font:16px system-ui}header{padding:24px 30px;background:#173a53;color:white}h1{font-size:23px;margin:0 0 6px}header p{margin:0;color:#d1e4ee}main{padding:20px;max-width:1400px;margin:auto}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{padding:10px;border:1px solid #b4c6d2;border-radius:6px;background:white;color:#193d56}canvas{width:100%;height:65vh;min-height:360px;background:#f9fbfc;border-radius:12px;margin-top:16px;touch-action:none}.note{padding:14px;background:#fff3d9;border-left:4px solid #ca8c26}.legend{display:flex;gap:16px;margin:10px 0}.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px}#metrics{font-weight:600}</style>
<header><h1>시편 변경 → 지그 CAD 자동 수정</h1><p>실제로 생성한 CadQuery 형상의 삼각형 메시 · 단위 mm</p></header>
<main><div class="toolbar"><select id="stage" aria-label="시나리오"><option value="0">수정 전: 두께 4 mm</option><option value="1" selected>수정 후: 두께 8 mm</option></select><button id="iso">입체</button><button id="front">정면</button><button id="top">평면</button><label><input type="checkbox" id="hide">시편·가압봉 숨기기</label><span id="metrics"></span></div>
<canvas id="cad" aria-label="드래그로 회전 가능한 지그 CAD"></canvas><div class="legend"><span><i class="dot" style="background:#386f9e"></i>출력 베이스</span><span><i class="dot" style="background:#39a99e"></i>출력 지지대</span><span><i class="dot" style="background:#acb7c2"></i>금속 부품</span><span><i class="dot" style="background:#eaaa47"></i>시편</span></div><p>드래그: 회전 · 휠: 확대/축소 · 기존 최대 간격 100 mm → 요구 간격 128 mm → 베이스 길이 220 mm 적용</p><p class="note">형상·치수 검증용 프로토타입입니다. 출력물 강도, 체결·롤러 이탈 방지, 시험기 장착부, 슬라이싱 및 실물 시험은 미검증입니다. 3MF는 형상 파일이며 프린터 설정을 포함하지 않습니다.</p></main>
<script>const models=__CAD_DATA__;
const c=document.getElementById('cad'),ctx=c.getContext('2d'),stage=document.getElementById('stage'),hide=document.getElementById('hide');let yaw=-.65,pitch=.55,zoom=1,drag=null;
function draw(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);ctx.scale(d,d);ctx.clearRect(0,0,r.width,r.height);const model=models[+stage.value],scale=Math.min(r.width/290,r.height/160)*zoom;document.getElementById('metrics').textContent='롤러 간격 '+model.span+' mm';const triangles=[];
for(const part of model.parts){if(hide.checked&&(part.kind==='specimen'||part.name==='metal_loading_nose'))continue;const v=part.v.map(([x,y,z])=>{z-=25;let a=x*Math.cos(yaw)-y*Math.sin(yaw),b=x*Math.sin(yaw)+y*Math.cos(yaw);return[a,b*Math.sin(pitch)-z*Math.cos(pitch),b*Math.cos(pitch)+z*Math.sin(pitch)]});for(const f of part.f){const vs=f.map(i=>v[i]);triangles.push({v:vs,depth:vs.reduce((s,p)=>s+p[2],0)/3,color:part.color})}}triangles.sort((a,b)=>a.depth-b.depth);for(const t of triangles){ctx.beginPath();t.v.forEach((p,i)=>{const x=r.width/2+p[0]*scale,y=r.height/2+p[1]*scale;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle=t.color;ctx.fill();ctx.strokeStyle=t.color;ctx.lineWidth=.4;ctx.stroke()}}
c.onpointerdown=e=>{drag=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.5,Math.min(1.57,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};c.onpointerup=()=>drag=null;c.onpointercancel=()=>drag=null;c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.4,Math.min(3,zoom*Math.exp(-e.deltaY*.001)));draw()},{passive:false});stage.onchange=draw;hide.onchange=draw;document.getElementById('iso').onclick=()=>{yaw=-.65;pitch=.55;zoom=1;draw()};document.getElementById('front').onclick=()=>{yaw=0;pitch=0;draw()};document.getElementById('top').onclick=()=>{yaw=0;pitch=Math.PI/2;draw()};addEventListener('resize',draw);draw();</script></html>
